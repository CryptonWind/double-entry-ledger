services:
  app:
    image: ledger-app:local
    x-description: First application instance
    build:
      context: .
      target: application
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_URL: jdbc:mysql://mysql:3306/ledger
      MYSQL_USERNAME: ledger
      MYSQL_PASSWORD: ledger
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ledger
      RABBITMQ_PASSWORD: ledger
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  app-2:
    image: ledger-app:local
    build:
      context: .
      target: application
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_URL: jdbc:mysql://mysql:3306/ledger
      MYSQL_USERNAME: ledger
      MYSQL_PASSWORD: ledger
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ledger
      RABBITMQ_PASSWORD: ledger
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      app:
        condition: service_healthy

  tests:
    profiles: [tests]
    build:
      context: .
      target: tests
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
