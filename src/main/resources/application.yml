spring:
  application:
    name: double-entry-ledger
  profiles:
    default: local
  docker:
    compose:
      enabled: false
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: 10
        default-requeue-rejected: true
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  config: classpath:log4j2-spring.xml

springdoc:
  packages-to-scan: com.ledger.infrastructure.input.rest
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yaml
    operations-sorter: alpha
    tags-sorter: alpha
